publish_to: 'none'
version: 1.1.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  http: ^1.2.0
  mobile_scanner: ^5.1.1
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  pdf: ^3.10.7
  printing: ^5.13.1
  excel: ^4.0.0
  path_provider: ^2.1.2
