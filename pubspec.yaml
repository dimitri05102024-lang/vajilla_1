name: cocina_escolar
description: "Aplicación de control de vajilla y utensilios para cocina escolar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Librerías utilizadas en la aplicación
  cupertino_icons: ^1.0.8
  http: ^1.2.2                  # Peticiones al Backend Node.js[cite: 1]
  mobile_scanner: ^5.1.1        # Escaneo de códigos QR/Barras[cite: 1]
  google_fonts: ^6.2.1          # Tipografía Poppins[cite: 1]
  fl_chart: ^0.69.0             # Gráficas estadísticas[cite: 1]
  
  # Librerías para exportación y guardado local en el teléfono (Guía 8)
  pdf: ^3.10.7                  # Generación de PDF[cite: 2]
  printing: ^5.12.0             # Impresión y visor PDF[cite: 2]
  excel: ^4.0.0               # Generación de Excel[cite: 2]
  path_provider: ^2.1.2         # Rutas de almacenamiento local
  open_file_plus: ^3.4.1        # Abrir/guardar archivos en el teléfono

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Declaración de recursos gráficos e iconos locales
  assets:
    - assets/icon/
    - assets/icon/Logo_IN.PNG
    - assets/icon/app_icon.png
    - assets/icon/logo.png
