name: cocina_escolar
description: "Sistema Integral de Gestión de Cafetín - INFRAMEN"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.1
  mobile_scanner: ^5.1.1
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  pdf: ^3.10.8
  printing: ^5.13.2
  excel: ^4.0.0
  path_provider: ^2.1.3
  open_file_plus: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Configuración de recursos (para el logotipo de la app)
  assets:
    - assets/icon/
